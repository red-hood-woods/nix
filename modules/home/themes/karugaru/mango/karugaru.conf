# =============================================================================
# mango config for karugaru - ported from manguru.conf, Quickshell removed
# Reload with: mmsg dispatch reload_config, or Mod+Shift+C below
# =============================================================================

monitorrule=name:HDMI-A-1,width:1680,height:1050,x:0,y:0
monitorrule=name:eDP-1,x:1680,y:0

xkb_rules_options=ctrl:nocaps
trackpad_natural_scrolling=1
tap_to_click=1

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

circle_layout=scroller,tile,grid
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.333,0.5,0.667,1.0

gappih=6
gappiv=6
gappoh=12
gappov=12

borderpx=3
no_border_when_single=0
border_radius=20

blur=1
blur_optimized=1
blur_params_num_passes=1
blur_params_noise=0.02
blur_params_saturation=1.5

windowrule=appid:^(eog|sxiv|feh|mpv|vlc|file-roller|xarchiver)$,isfloating:1
windowrule=appid:^org\.gnome\.Nautilus$,title:.*Progress.*,isfloating:1
windowrule=appid:^org\.gnome\.Nautilus$,title:.*Replace.*,isfloating:1

cursor_theme=capitaine-cursors
cursor_size=24

env=XDG_CURRENT_DESKTOP,mango
env=PYTHONIOENCODING,utf-8

# --- Autostart ---------------------------------------------------------
exec-once=mangobar
exec-once=mako

# --- Binds -----------------------------------------------------------------

bind=SUPER,Return,spawn,foot
bind=SUPER,d,spawn,fuzzel
bind=SUPER,Print,spawn,sh -c 'grim -g "$(slurp)" ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png'
bind=SUPER,p,spawn,makoctl,dismiss,--all
bind=SUPER,l,spawn,swaylock

bind=SUPER,w,spawn,firefox-esr
bind=SUPER,e,spawn,nautilus
bind=SUPER,a,spawn,foot -e yazi
bind=SUPER,m,spawn,spotify
bind=SUPER,n,spawn,mpv --player-operation-mode=pseudo-gui

bind=none,XF86AudioRaiseVolume,spawn,pactl,set-sink-volume,@DEFAULT_SINK@,+5%
bind=none,XF86AudioLowerVolume,spawn,pactl,set-sink-volume,@DEFAULT_SINK@,-5%
bind=none,XF86AudioMute,spawn,pactl,set-sink-mute,@DEFAULT_SINK@,toggle
bind=none,XF86MonBrightnessUp,spawn,brightnessctl,set,+5%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl,set,5%-

bind=SUPER,c,killclient
bind=ALT,F4,killclient
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,space,togglefloating

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,KP_Left,focusdir,left
bind=SUPER,KP_Right,focusdir,right
bind=SUPER,KP_Up,focusdir,up
bind=SUPER,KP_Down,focusdir,down

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,KP_Left,exchange_client,left
bind=SUPER+SHIFT,KP_Right,exchange_client,right
bind=SUPER+SHIFT,KP_Up,exchange_client,up
bind=SUPER+SHIFT,KP_Down,exchange_client,down

bind=SUPER,h,scroller_stack,left
bind=SUPER,v,scroller_stack,right

bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft,0
bind=SUPER+CTRL+SHIFT,Right,tagtoright,0
bind=SUPER+CTRL+SHIFT,Left,tagtoleft,0
bind=SUPER+CTRL,KP_Right,viewtoright,0
bind=SUPER+CTRL,KP_Left,viewtoleft,0
bind=SUPER+CTRL+SHIFT,KP_Right,tagtoright,0
bind=SUPER+CTRL+SHIFT,KP_Left,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0

bind=SUPER,r,switch_proportion_preset,
bind=ALT,e,set_proportion,1.0

bind=SUPER+SHIFT,q,quit
bind=SUPER+SHIFT,c,reload_config
bind=SUPER,s,toggleoverview
bind=ALT,Tab,toggleoverview
bind=SUPER,Tab,togglejump

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

source=~/.config/mango/flutterice.conf
